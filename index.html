<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSORA 点播源在线检测</title>
<style>
:root{color-scheme:dark;--bg:#10141d;--panel:#1a2230;--line:#2b3749;--muted:#9ba9bb;--txt:#eef3fa;--blue:#79b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{font-size:25px;margin:0 0 5px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#111a27;border:1px solid var(--line);border-radius:11px;padding:13px}.num{font-size:27px;font-weight:700}.label{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}input,select,button{background:#111a27;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}input{flex:1;min-width:190px}button{cursor:pointer;color:var(--blue)}button:hover{border-color:var(--blue)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:13px}.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;background:#303b4c}.ok{background:#164b37;color:#a4f0c9}.bad{background:#57272b;color:#ffb4b4}.warn{background:#58431e;color:#ffe0a0}.info{background:#233d5b;color:#b8dcff}.small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}a{color:var(--blue)}.empty{padding:25px;text-align:center;color:var(--muted)}
</style></head><body><main class="wrap"><h1>MOSORA 点播源在线检测</h1><div class="muted">自动读取仓库 tvbox.json 检测结果 · 不需要安装软件</div>
<section class="panel"><div id="updated" class="muted">正在读取检测结果…</div><div class="stats" id="stats" style="margin-top:14px"></div><p id="note" class="small"></p></section>
<div class="toolbar"><input id="q" placeholder="搜索站点名称 / key / API 地址"><select id="filter"><option value="全部">全部状态</option><option>接口响应正常</option><option>访问异常</option><option>疑似拦截</option><option>返回内容待确认</option><option>需TVBox实测</option></select><button id="refresh">刷新结果</button></div>
<section class="panel tablewrap"><table><thead><tr><th>站点</th><th>类型</th><th>检测状态</th><th>详情</th><th>耗时</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">载入中…</td></tr></tbody></table></section>
<p class="small">说明：HTTP 接口返回正常只代表接口能响应，不保证影视详情和视频播放成功。大量 csp/Spider 站点依赖 TVBox 客户端及 JAR，本网页会标记为“需TVBox实测”，不会误报为失效。</p></main>
<script>
let all=[];const labels=['接口响应正常','访问异常','疑似拦截','返回内容待确认','需TVBox实测'];
function cls(s){return s==='接口响应正常'?'ok':s==='访问异常'?'bad':s==='疑似拦截'||s==='返回内容待确认'?'warn':'info'}
function render(){const q=document.querySelector('#q').value.toLowerCase(),f=document.querySelector('#filter').value;const rows=all.filter(x=>(f==='全部'||x.status===f)&&[x.name,x.key,x.api].join(' ').toLowerCase().includes(q));document.querySelector('#rows').innerHTML=rows.length?rows.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="small">${esc(x.key)}</div><div class="small">${esc(x.api)}</div></td><td>${esc(String(x.type??''))}</td><td><span class="tag ${cls(x.status)}">${esc(x.status)}</span></td><td>${esc(x.detail||'')}</td><td>${x.ms==null?'—':x.ms+' ms'}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">没有符合条件的站点</td></tr>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){document.querySelector('#updated').textContent='正在读取检测结果…';try{const r=await fetch('./health.json?t='+Date.now());if(!r.ok)throw Error('检测结果尚未生成');const d=await r.json();all=d.results||[];document.querySelector('#updated').textContent='最近检测：'+new Date(d.generated_at).toLocaleString()+' · 共 '+d.total+' 个站点';document.querySelector('#note').textContent=d.note||'';document.querySelector('#stats').innerHTML=labels.map(s=>`<div class="stat"><div class="num">${d.counts?.[s]??0}</div><div class="label">${s}</div></div>`).join('');render()}catch(e){document.querySelector('#updated').textContent='暂时没有检测结果：'+e.message+'。请先在 GitHub Actions 运行 MOSORA 在线检测。';document.querySelector('#rows').innerHTML='<tr><td colspan="5" class="empty">等待首次检测完成</td></tr>'}}
document.querySelector('#q').addEventListener('input',render);document.querySelector('#filter').addEventListener('change',render);document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
