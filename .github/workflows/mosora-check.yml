name: MOSORA 点播源在线检测

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tvbox.json'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/mosora-check.yml'
  schedule:
    - cron: '17 3 * * *' # 每天 UTC 03:17 自动检测

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mosora-pages
  cancel-in-progress: true

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check 512 TVBox sites
        run: python scripts/check_sources.py
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

